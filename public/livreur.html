<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur Livreur</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #map { height: 400px; width: 100%; }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-offline { background-color: #dc3545; }
        .status-online { background-color: #28a745; }
        .status-delivering { background-color: #ffc107; }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5><span class="status-indicator status-offline" id="connectionStatus"></span>Simulateur Livreur</h5>
                    </div>
                    <div class="card-body">
                        <!-- Configuration initiale -->
                        <div id="setupPanel">
                            <h6>Configuration du livreur</h6>
                            <form id="driverSetup">
                                <div class="mb-3">
                                    <label class="form-label">Nom du livreur</label>
                                    <input type="text" class="form-control" id="driverName" value="Michel Dupont" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Téléphone</label>
                                    <input type="tel" class="form-control" id="driverPhone" value="+33612345678" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Position de départ (Lat, Lng)</label>
                                    <div class="row">
                                        <div class="col">
                                            <input type="number" class="form-control" id="startLat" placeholder="Latitude" value="3.848" step="any" required>
                                        </div>
                                        <div class="col">
                                            <input type="number" class="form-control" id="startLng" placeholder="Longitude" value="11.502" step="any" required>
                                        </div>
                                    </div>
                                    <small class="text-muted">Cliquez sur la carte pour définir la position</small>
                                </div>
                                <button type="submit" class="btn btn-success">Se connecter</button>
                            </form>
                        </div>

                        <!-- Panel de livraison -->
                        <div id="deliveryPanel" style="display: none;">
                            <div class="mb-3">
                                <h6>Informations livreur</h6>
                                <p><strong>Nom:</strong> <span id="currentDriverName"></span></p>
                                <p><strong>Position:</strong> <span id="currentPosition"></span></p>
                                <p><strong>Statut:</strong> <span id="currentStatus" class="badge bg-secondary">Libre</span></p>
                            </div>

                            <div class="mb-3">
                                <h6>Créer une nouvelle livraison</h6>
                                <form id="createDeliveryForm">
                                    <div class="mb-2">
                                        <input type="text" class="form-control" id="customerName" placeholder="Nom client" value="Jean Martin" required>
                                    </div>
                                    <div class="mb-2">
                                        <input type="text" class="form-control" id="destinationAddress" placeholder="Adresse destination" value="Tour Eiffel, Paris" required>
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col">
                                            <input type="number" class="form-control" id="destLat" placeholder="Dest Lat" value="48.8584" step="any" required>
                                        </div>
                                        <div class="col">
                                            <input type="number" class="form-control" id="destLng" placeholder="Dest Lng" value="2.2945" step="any" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Créer livraison</button>
                                </form>
                            </div>

                            <!-- Livraisons disponibles -->
                            <div class="mb-3">
                                <h6>Mes livraisons</h6>
                                <div id="deliveriesList"></div>
                            </div>

                            <!-- Contrôles de simulation -->
                            <div id="simulationControls" style="display: none;">
                                <h6>Contrôles de simulation</h6>
                                <div class="mb-2">
                                    <label class="form-label">Vitesse de simulation</label>
                                    <input type="range" class="form-range" id="simulationSpeed" min="1" max="10" value="3">
                                    <small class="text-muted">Lent ← → Rapide</small>
                                </div>
                                <div class="btn-group w-100" role="group">
                                    <button class="btn btn-success" id="startSimulation">Démarrer livraison</button>
                                    <button class="btn btn-warning" id="pauseSimulation" disabled>Pause</button>
                                    <button class="btn btn-danger" id="stopSimulation" disabled>Arrêter</button>
                                </div>
                                <div class="mt-2">
                                    <small class="text-muted">Progression: <span id="progressPercent">0%</span></small>
                                    <div class="progress">
                                        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h6>Carte - Position livreur</h6>
                    </div>
                    <div class="card-body p-0">
                        <div id="map"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class DeliveryDriverSimulator {
            constructor() {
                this.apiBaseUrl = 'http://127.0.0.1:8000/api'; // Adjust to your Laravel URL
                this.mapboxToken = 'pk.eyJ1IjoiaGFycm9sZHdhZm8iLCJhIjoiY21kcjkwenJxMGVtYzJsczY0aXgzbGN6OCJ9.WGRlvNUJFaEFbmvoeTTGlQ'; // REMPLACER PAR VOTRE TOKEN
                this.map = null;
                this.currentPosition = null;
                this.selectedDelivery = null;
                this.simulationInterval = null;
                this.routeCoordinates = [];
                this.currentRouteIndex = 0;
                this.isSimulating = false;
                this.driverMarker = null;
                this.destinationMarker = null;
                
                this.init();
            }

            init() {
                this.initMap();
                this.bindEvents();
                this.updateConnectionStatus(false);
            }

            initMap() {
                mapboxgl.accessToken = this.mapboxToken;
                
                this.map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/streets-v11',
                    center: [11.502, 3.848], // Yaoundé, Cameroun
                    zoom: 12
                });

                this.map.on('click', (e) => {
                    if (document.getElementById('setupPanel').style.display !== 'none') {
                        document.getElementById('startLat').value = e.lngLat.lat.toFixed(6);
                        document.getElementById('startLng').value = e.lngLat.lng.toFixed(6);
                        this.updateDriverPosition(e.lngLat.lat, e.lngLat.lng);
                    }
                });
            }

            bindEvents() {
                document.getElementById('driverSetup').onsubmit = (e) => this.handleDriverSetup(e);
                document.getElementById('createDeliveryForm').onsubmit = (e) => this.createDelivery(e);
                document.getElementById('startSimulation').onclick = () => this.startSimulation();
                document.getElementById('pauseSimulation').onclick = () => this.pauseSimulation();
                document.getElementById('stopSimulation').onclick = () => this.stopSimulation();
            }

            async handleDriverSetup(e) {
                e.preventDefault();
                
                const driverName = document.getElementById('driverName').value;
                const driverPhone = document.getElementById('driverPhone').value;
                const lat = parseFloat(document.getElementById('startLat').value);
                const lng = parseFloat(document.getElementById('startLng').value);

                this.currentPosition = { lat, lng };
                this.updateDriverPosition(lat, lng);
                
                document.getElementById('currentDriverName').textContent = driverName;
                document.getElementById('currentPosition').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                
                document.getElementById('setupPanel').style.display = 'none';
                document.getElementById('deliveryPanel').style.display = 'block';
                this.updateConnectionStatus(true);
                
                await this.loadDeliveries();
            }

            async createDelivery(e) {
                e.preventDefault();
                
                const customerName = document.getElementById('customerName').value;
                const destinationAddress = document.getElementById('destinationAddress').value;
                const destLat = parseFloat(document.getElementById('destLat').value);
                const destLng = parseFloat(document.getElementById('destLng').value);
                const driverName = document.getElementById('driverName').value;
                const driverPhone = document.getElementById('driverPhone').value;

                try {
                    const response = await fetch(`${this.apiBaseUrl}/delivery/create`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            customer_name: customerName,
                            driver_name: driverName,
                            driver_phone: driverPhone,
                            destination_lat: destLat,
                            destination_lng: destLng,
                            destination_address: destinationAddress
                        })
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        alert('Livraison créée avec succès!');
                        await this.loadDeliveries();
                        document.getElementById('createDeliveryForm').reset();
                    }
                } catch (error) {
                    console.error('Error creating delivery:', error);
                    alert('Erreur lors de la création de la livraison');
                }
            }

            async loadDeliveries() {
                try {
                    const response = await fetch(`${this.apiBaseUrl}/delivery/active`);
                    const data = await response.json();
                    
                    if (data.success) {
                        this.renderDeliveries(data.deliveries);
                    }
                } catch (error) {
                    console.error('Error loading deliveries:', error);
                }
            }

            renderDeliveries(deliveries) {
                const list = document.getElementById('deliveriesList');
                list.innerHTML = '';

                const driverName = document.getElementById('driverName').value;
                const myDeliveries = deliveries.filter(d => d.driver_name === driverName);

                if (myDeliveries.length === 0) {
                    list.innerHTML = '<p class="text-muted">Aucune livraison</p>';
                    return;
                }

                myDeliveries.forEach(delivery => {
                    const div = document.createElement('div');
                    div.className = 'border rounded p-2 mb-2';
                    div.innerHTML = `
                        <div class="d-flex justify-content-between">
                            <div>
                                <strong>${delivery.order_number}</strong><br>
                                <small>Client: ${delivery.customer_name}</small><br>
                                <small>Destination: ${delivery.destination_address}</small>
                            </div>
                            <div>
                                <span class="badge bg-${this.getStatusColor(delivery.status)}">${delivery.status}</span>
                                ${delivery.status === 'pending' ? 
                                    `<button class="btn btn-sm btn-success ms-1" onclick="simulator.selectDelivery('${delivery.order_number}')">Sélectionner</button>` 
                                    : ''}
                            </div>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }

            selectDelivery(orderNumber) {
                this.selectedDelivery = orderNumber;
                document.getElementById('simulationControls').style.display = 'block';
                alert(`Livraison ${orderNumber} sélectionnée ! Vous pouvez maintenant démarrer la simulation.`);
            }

            async startSimulation() {
                if (!this.selectedDelivery) {
                    alert('Veuillez sélectionner une livraison');
                    return;
                }

                try {
                    // Démarrer la livraison
                    const response = await fetch(`${this.apiBaseUrl}/delivery/${this.selectedDelivery}/start`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            driver_lat: this.currentPosition.lat,
                            driver_lng: this.currentPosition.lng
                        })
                    });

                    const data = await response.json();
                    
                    if (data.success && data.route && data.route.geometry) {
                        this.routeCoordinates = data.route.geometry.coordinates;
                        this.currentRouteIndex = 0;
                        this.isSimulating = true;
                        
                        this.addDestinationMarker(data.delivery.destination_lat, data.delivery.destination_lng);
                        this.drawRoute();
                        this.runSimulation();
                        
                        document.getElementById('startSimulation').disabled = true;
                        document.getElementById('pauseSimulation').disabled = false;
                        document.getElementById('stopSimulation').disabled = false;
                        document.getElementById('currentStatus').textContent = 'En livraison';
                        document.getElementById('currentStatus').className = 'badge bg-warning';
                    }
                } catch (error) {
                    console.error('Error starting delivery:', error);
                    alert('Erreur lors du démarrage de la livraison');
                }
            }

            runSimulation() {
                if (!this.isSimulating) return;

                const speed = parseInt(document.getElementById('simulationSpeed').value);
                const interval = 11000 / speed; // Base interval adjusted by speed

                this.simulationInterval = setInterval(() => {
                    if (this.currentRouteIndex < this.routeCoordinates.length) {
                        const coord = this.routeCoordinates[this.currentRouteIndex];
                        const lng = coord[0];
                        const lat = coord[1];
                        
                        this.updateDriverPosition(lat, lng);
                        this.currentPosition = { lat, lng };
                        
                        // Mise à jour API
                        this.updatePositionAPI(lat, lng);
                        
                        // Mise à jour progress
                        const progress = (this.currentRouteIndex / this.routeCoordinates.length) * 100;
                        this.updateProgress(progress);
                        
                        this.currentRouteIndex += Math.max(1, Math.floor(speed / 2));
                        
                        if (this.currentRouteIndex >= this.routeCoordinates.length) {
                            this.completeDelivery();
                        }
                    }
                }, interval);
            }

            async updatePositionAPI(lat, lng) {
                if (!this.selectedDelivery) return;

                try {
                    await fetch(`${this.apiBaseUrl}/delivery/${this.selectedDelivery}/position`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            driver_lat: lat,
                            driver_lng: lng
                        })
                    });
                } catch (error) {
                    console.error('Error updating position:', error);
                }
            }

            pauseSimulation() {
                this.isSimulating = false;
                if (this.simulationInterval) {
                    clearInterval(this.simulationInterval);
                }
                document.getElementById('startSimulation').disabled = false;
                document.getElementById('pauseSimulation').disabled = true;
            }

            stopSimulation() {
                this.isSimulating = false;
                if (this.simulationInterval) {
                    clearInterval(this.simulationInterval);
                }
                this.currentRouteIndex = 0;
                document.getElementById('startSimulation').disabled = false;
                document.getElementById('pauseSimulation').disabled = true;
                document.getElementById('stopSimulation').disabled = true;
                document.getElementById('currentStatus').textContent = 'Libre';
                document.getElementById('currentStatus').className = 'badge bg-secondary';
                this.updateProgress(0);
            }

            completeDelivery() {
                this.isSimulating = false;
                clearInterval(this.simulationInterval);
                alert('Livraison terminée !');
                document.getElementById('currentStatus').textContent = 'Livre';
                document.getElementById('currentStatus').className = 'badge bg-success';
                this.updateProgress(100);
                setTimeout(() => {
                    this.stopSimulation();
                    this.loadDeliveries();
                }, 2000);
            }

            updateDriverPosition(lat, lng) {
                if (this.driverMarker) {
                    this.driverMarker.remove();
                }
                
                this.driverMarker = new mapboxgl.Marker({ color: '#1E88E5' })
                    .setLngLat([lng, lat])
                    .addTo(this.map);

                this.map.setCenter([lng, lat]);
                document.getElementById('currentPosition').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            }

            addDestinationMarker(lat, lng) {
                if (this.destinationMarker) {
                    this.destinationMarker.remove();
                }
                
                this.destinationMarker = new mapboxgl.Marker({ color: '#E53935' })
                    .setLngLat([lng, lat])
                    .addTo(this.map);
            }

            drawRoute() {
                const sourceId = 'driver-route';
                const layerId = 'driver-route-layer';

                if (this.map.getLayer(layerId)) {
                    this.map.removeLayer(layerId);
                }
                if (this.map.getSource(sourceId)) {
                    this.map.removeSource(sourceId);
                }

                this.map.addSource(sourceId, {
                    type: 'geojson',
                    data: {
                        type: 'Feature',
                        properties: {},
                        geometry: {
                            type: 'LineString',
                            coordinates: this.routeCoordinates
                        }
                    }
                });

                this.map.addLayer({
                    id: layerId,
                    type: 'line',
                    source: sourceId,
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                        'line-color': '#1E88E5',
                        'line-width': 4,
                        'line-opacity': 0.8
                    }
                });
            }

            updateProgress(percent) {
                document.getElementById('progressPercent').textContent = `${Math.round(percent)}%`;
                document.getElementById('progressBar').style.width = `${percent}%`;
            }

            updateConnectionStatus(connected) {
                const indicator = document.getElementById('connectionStatus');
                if (connected) {
                    indicator.className = 'status-indicator status-online';
                } else {
                    indicator.className = 'status-indicator status-offline';
                }
            }

            getStatusColor(status) {
                switch (status) {
                    case 'pending': return 'secondary';
                    case 'started': return 'warning';
                    case 'in_progress': return 'info';
                    case 'delivered': return 'success';
                    default: return 'secondary';
                }
            }
        }

        // Initialiser le simulateur
        let simulator;
        document.addEventListener('DOMContentLoaded', function() {
            simulator = new DeliveryDriverSimulator();
        });
    </script>
</body>
</html>
