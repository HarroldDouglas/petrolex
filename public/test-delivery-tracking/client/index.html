<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Client - Suivi Livraison Réel</title>
    
    <!-- External Libraries -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5><span class="status-indicator status-offline" id="connectionStatus"></span>Interface Client - Système Réel</h5>
                    </div>
                    <div class="card-body">
                        <!-- Sélection du client -->
                        <div id="customerSelectionPanel">
                            <div class="section-header">
                                <h6><i class="fas fa-user-friends"></i> Sélection Client</h6>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Rechercher un client</label>
                                <input type="text" class="form-control" id="customerSearchInput" 
                                       placeholder="Nom, email ou téléphone...">
                            </div>
                            <div id="customersList"></div>
                            <div id="customerPagination" class="d-flex justify-content-center mt-3"></div>
                        </div>

                        <!-- Panel client sélectionné -->
                        <div id="selectedCustomerPanel" style="display: none;">
                            <div class="selected-customer-info">
                                <div class="section-header d-flex justify-content-between align-items-center">
                                    <h6><i class="fas fa-user"></i> Client Sélectionné</h6>
                                    <button class="btn btn-outline-secondary btn-sm" id="changeCustomerBtn">
                                        <i class="fas fa-exchange-alt"></i> Changer
                                    </button>
                                </div>
                                <div class="customer-info-card">
                                    <p class="mb-1"><strong>Nom:</strong> <span id="selectedCustomerName"></span></p>
                                    <p class="mb-1"><strong>Email:</strong> <span id="selectedCustomerEmail"></span></p>
                                    <p class="mb-0"><strong>Téléphone:</strong> <span id="selectedCustomerPhone"></span></p>
                                </div>
                            </div>

                            <!-- Commandes du client -->
                            <div class="mb-3">
                                <div class="section-header d-flex justify-content-between align-items-center">
                                    <h6><i class="fas fa-shopping-cart"></i> Commandes</h6>
                                    <button class="btn btn-outline-primary btn-sm" id="refreshOrdersBtn">
                                        <i class="fas fa-sync-alt"></i> Actualiser
                                    </button>
                                </div>
                                
                                <!-- Filtres -->
                                <div class="mb-3">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <select class="form-select form-select-sm" id="statusFilter">
                                                <option value="">Tous les statuts</option>
                                                <option value="confirmed">Confirmées</option>
                                                <option value="in_progress">En cours</option>
                                                <option value="delivered">Livrées</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <input type="text" class="form-control form-control-sm" 
                                                   id="orderNumberFilter" placeholder="N° commande">
                                        </div>
                                    </div>
                                </div>
                                
                                <div id="ordersList"></div>
                                
                                <!-- Pagination -->
                                <div id="ordersPagination" class="d-flex justify-content-center mt-3"></div>
                            </div>

                            <!-- Commande sélectionnée pour suivi -->
                            <div id="selectedOrderPanel" style="display: none;">
                                <div class="section-header">
                                    <h6><i class="fas fa-map-marker-alt"></i> Suivi en Temps Réel</h6>
                                </div>
                                <div class="tracking-info-card">
                                    <div class="row">
                                        <div class="col-md-8">
                                            <h6 id="trackingOrderNumber" class="text-primary mb-2"></h6>
                                            <p class="mb-1"><strong>Statut:</strong> <span id="trackingOrderStatus" class="badge"></span></p>
                                            <p class="mb-1"><strong>Livreur:</strong> <span id="trackingDriverName">-</span></p>
                                            <p class="mb-0"><strong>Adresse:</strong> <span id="trackingDeliveryAddress"></span></p>
                                        </div>
                                        <div class="col-md-4 text-end">
                                            <div class="tracking-stats">
                                                <div class="stat-item">
                                                    <i class="fas fa-clock text-warning"></i>
                                                    <span id="trackingETA">-</span>
                                                </div>
                                                <div class="stat-item">
                                                    <i class="fas fa-route text-info"></i>
                                                    <span id="trackingDistance">-</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Barre de progression -->
                                    <div class="mt-3">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <small class="text-muted">Progression de la livraison</small>
                                            <small class="text-muted"><span id="trackingProgress">0%</span></small>
                                        </div>
                                        <div class="progress">
                                            <div class="progress-bar bg-primary" id="trackingProgressBar" style="width: 0%"></div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Actions -->
                                <div class="mt-3">
                                    <button class="btn btn-outline-secondary btn-sm w-100" id="stopTrackingBtn">
                                        <i class="fas fa-times"></i> Arrêter le suivi
                                    </button>
                                </div>
                            </div>

                            <!-- Historique des mises à jour -->
                            <div id="trackingHistoryPanel" class="mt-3" style="display: none;">
                                <div class="section-header">
                                    <h6><i class="fas fa-history"></i> Historique</h6>
                                </div>
                                <div id="trackingHistory" class="tracking-history"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h6><i class="fas fa-map"></i> Carte - Suivi de Livraison</h6>
                    </div>
                    <div class="card-body p-0">
                        <div id="map"></div>
                    </div>
                </div>
                
                <!-- Informations de connexion -->
                <div class="card mt-3">
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-md-3">
                                <div class="connection-info">
                                    <i class="fas fa-wifi text-primary"></i>
                                    <small class="d-block">WebSocket</small>
                                    <span id="websocketStatus" class="badge bg-secondary">Déconnecté</span>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="connection-info">
                                    <i class="fas fa-server text-success"></i>
                                    <small class="d-block">API</small>
                                    <span id="apiStatus" class="badge bg-success">Connecté</span>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="connection-info">
                                    <i class="fas fa-map text-info"></i>
                                    <small class="d-block">Mapbox</small>
                                    <span id="mapStatus" class="badge bg-info">Chargé</span>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="connection-info">
                                    <i class="fas fa-clock text-warning"></i>
                                    <small class="d-block">Dernière MAJ</small>
                                    <span id="lastUpdateTime">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/config.js"></script>
    <script src="js/services.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
