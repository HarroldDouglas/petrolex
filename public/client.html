<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur Client - Suivi Livraison</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        #map { 
            height: 400px; 
            width: 100%; 
            border-radius: 8px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-pending { background-color: #6c757d; }
        .status-assigned { background-color: #0d6efd; }
        .status-picked-up { background-color: #fd7e14; }
        .status-in-transit { background-color: #ffc107; }
        .status-delivered { background-color: #198754; }
        .driver-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .eta-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0d6efd;
        }
        .distance-display {
            font-size: 1.1rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5><span class="status-indicator status-pending" id="connectionStatus"></span>Suivi de ma Livraison</h5>
                    </div>
                    <div class="card-body">
                        <!-- Panneau de recherche de commande -->
                        <div id="setupPanel">
                            <h6>Suivre ma commande</h6>
                            <form id="trackingForm">
                                <div class="mb-3">
                                    <label for="orderNumber" class="form-label">Numéro de commande</label>
                                    <input type="text" class="form-control" id="orderNumber" 
                                           placeholder="Ex: ORD-20240101-001" required>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-search"></i> Suivre ma commande
                                </button>
                            </form>

                            <hr>
                            <h6>Commandes actives</h6>
                            <div id="availableOrders" class="mt-2">
                                <small class="text-muted">Chargement...</small>
                            </div>
                        </div>

                        <!-- Panneau de suivi actif -->
                        <div id="trackingPanel" style="display: none;">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6>Commande: <span id="currentOrderNumber"></span></h6>
                                <button class="btn btn-sm btn-outline-secondary" onclick="clientSimulator.resetTracking()">
                                    Retour
                                </button>
                            </div>

                            <!-- Informations du livreur -->
                            <div id="driverInfo" class="driver-info" style="display: none;">
                                <div class="row">
                                    <div class="col-8">
                                        <h6 class="mb-1" id="driverName">-</h6>
                                        <small id="driverPhone">-</small>
                                    </div>
                                    <div class="col-4 text-end">
                                        <button class="btn btn-sm btn-light" onclick="clientSimulator.callDriver()">
                                            📞 Appeler
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Statut de la livraison -->
                            <div class="alert alert-info">
                                <strong>Statut:</strong> 
                                <span class="status-indicator status-pending" id="deliveryStatusIndicator"></span>
                                <span id="deliveryStatus">En attente</span>
                            </div>

                            <!-- ETA et Distance -->
                            <div class="row text-center mb-3">
                                <div class="col-6">
                                    <div class="eta-display" id="etaDisplay">--</div>
                                    <small class="text-muted">Temps estimé</small>
                                </div>
                                <div class="col-6">
                                    <div class="distance-display" id="distanceDisplay">--</div>
                                    <small class="text-muted">Distance</small>
                                </div>
                            </div>

                            <!-- Progression de la livraison -->
                            <div class="progress mb-3" style="height: 6px;">
                                <div class="progress-bar" role="progressbar" id="progressBar" 
                                     style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>

                            <!-- Historique des événements -->
                            <div class="card">
                                <div class="card-header">
                                    <h6 class="mb-0">Historique</h6>
                                </div>
                                <div class="card-body p-2">
                                    <div id="deliveryHistory" style="max-height: 150px; overflow-y: auto;">
                                        <!-- Historique sera affiché ici -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h6>Localisation en temps réel</h6>
                    </div>
                    <div class="card-body p-2">
                        <div id="map"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class DeliveryClientSimulator {
            constructor() {
                this.mapboxToken = 'pk.eyJ1IjoiaGFycm9sZHdhZm8iLCJhIjoiY21kcjkwenJxMGVtYzJsczY0aXgzbGN6OCJ9.WGRlvNUJFaEFbmvoeTTGlQ'; // REMPLACER PAR VOTRE TOKEN
                this.apiBaseUrl = 'http://127.0.0.1:8000/api';
                this.pusher = null;
                this.channel = null;
                this.map = null;
                this.currentOrder = null;
                this.driverMarker = null;
                this.destinationMarker = null;
                this.routeSource = null;

                this.statusTranslations = {
                    'pending': 'En attente',
                    'assigned': 'Livreur assigné',
                    'picked_up': 'Récupérée',
                    'in_transit': 'En cours de livraison',
                    'delivered': 'Livrée',
                    'cancelled': 'Annulée'
                };

                this.statusProgress = {
                    'pending': 10,
                    'assigned': 25,
                    'picked_up': 50,
                    'in_transit': 75,
                    'delivered': 100,
                    'cancelled': 0
                };

                this.init();
            }

            init() {
                this.initMap();
                this.initPusher();
                this.bindEvents();
                this.loadAvailableOrders();
                this.updateConnectionStatus('offline');
            }

            initMap() {
                mapboxgl.accessToken = this.mapboxToken;
                
                this.map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/streets-v11',
                    center: [11.502, 3.848], // Yaoundé, Cameroun par défaut
                    zoom: 12
                });

                this.map.on('load', () => {
                    console.log('Map loaded');
                    // Ajouter la source pour la route
                    this.map.addSource('route', {
                        'type': 'geojson',
                        'data': {
                            'type': 'Feature',
                            'properties': {},
                            'geometry': {
                                'type': 'LineString',
                                'coordinates': []
                            }
                        }
                    });

                    // Ajouter la couche pour afficher la route
                    this.map.addLayer({
                        'id': 'route',
                        'type': 'line',
                        'source': 'route',
                        'layout': {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        'paint': {
                            'line-color': '#3887be',
                            'line-width': 5,
                            'line-opacity': 0.75
                        }
                    });
                });
            }

            initPusher() {
                try {
                    this.pusher = new Pusher('local', {
                        wsHost: '127.0.0.1',
                        wsPort: 8080,
                        wssPort: 8080,
                        forceTLS: false,
                        enabledTransports: ['ws', 'wss'],
                        cluster: 'mt1'
                    });

                    this.pusher.connection.bind('connected', () => {
                        console.log('Connected to Pusher');
                        this.updateConnectionStatus('online');
                    });

                    this.pusher.connection.bind('disconnected', () => {
                        console.log('Disconnected from Pusher');
                        this.updateConnectionStatus('offline');
                    });
                } catch (error) {
                    console.error('Error initializing Pusher:', error);
                }
            }

            updateConnectionStatus(status) {
                const indicator = document.getElementById('connectionStatus');
                indicator.className = `status-indicator status-${status === 'online' ? 'delivered' : 'pending'}`;
            }

            bindEvents() {
                document.getElementById('trackingForm').addEventListener('submit', (e) => {
                    this.startTracking(e);
                });
            }

            async loadAvailableOrders() {
                try {
                    const response = await fetch(`${this.apiBaseUrl}/delivery/active`);
                    const data = await response.json();
                    
                    if (data.success) {
                        this.renderAvailableOrders(data.deliveries);
                    } else {
                        this.renderAvailableOrders([]);
                    }
                } catch (error) {
                    console.error('Error loading orders:', error);
                    document.getElementById('availableOrders').innerHTML = 
                        '<p class="text-danger">Erreur de connexion au serveur</p>';
                }
            }

            renderAvailableOrders(deliveries) {
                const container = document.getElementById('availableOrders');
                container.innerHTML = `
                    <button class="btn btn-sm btn-outline-primary mb-2" onclick="clientSimulator.loadAvailableOrders()">
                        🔄 Actualiser
                    </button>
                `;

                if (deliveries.length === 0) {
                    container.innerHTML += '<p class="text-muted">Aucune commande active</p>';
                    return;
                }

                deliveries.forEach(delivery => {
                    const div = document.createElement('div');
                    div.className = 'border rounded p-2 mb-2';
                    div.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small><strong>${delivery.order_number || 'N/A'}</strong></small><br>
                                <small class="text-muted">${delivery.customer_name || 'Client'}</small><br>
                                <small class="badge bg-${this.getStatusBadgeColor(delivery.status)}">${this.statusTranslations[delivery.status] || delivery.status}</small>
                            </div>
                            <button class="btn btn-sm btn-success" onclick="clientSimulator.selectOrder('${delivery.order_number}')">
                                👁️ Suivre
                            </button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            getStatusBadgeColor(status) {
                const colors = {
                    'pending': 'secondary',
                    'assigned': 'primary',
                    'picked_up': 'warning',
                    'in_transit': 'info',
                    'delivered': 'success',
                    'cancelled': 'danger'
                };
                return colors[status] || 'secondary';
            }

            selectOrder(orderNumber) {
                document.getElementById('orderNumber').value = orderNumber;
                const event = new Event('submit');
                this.startTracking(event);
            }

            async startTracking(e) {
                e.preventDefault();
                
                const orderNumber = document.getElementById('orderNumber').value.trim();
                
                if (!orderNumber) {
                    alert('Veuillez saisir un numéro de commande');
                    return;
                }

                try {
                    const response = await fetch(`${this.apiBaseUrl}/delivery/${orderNumber}`);
                    const data = await response.json();
                    
                    if (data.success) {
                        this.currentOrder = data.delivery;
                        this.setupTracking();
                        this.subscribeToUpdates(orderNumber);
                        this.addToHistory(`Suivi démarré pour la commande ${orderNumber}`);
                    } else {
                        alert('Commande non trouvée');
                    }
                } catch (error) {
                    console.error('Error loading order:', error);
                    alert('Erreur lors du chargement de la commande');
                }
            }

            setupTracking() {
                // Basculer vers le panneau de suivi
                document.getElementById('setupPanel').style.display = 'none';
                document.getElementById('trackingPanel').style.display = 'block';
                document.getElementById('currentOrderNumber').textContent = this.currentOrder.order_number;

                // Mettre à jour les informations
                this.updateDeliveryInfo();
                this.updateMapView();
            }

            subscribeToUpdates(orderNumber) {
                if (this.channel) {
                    this.pusher.unsubscribe(this.channel.name);
                }

                this.channel = this.pusher.subscribe(`delivery.${orderNumber}`);
                
                this.channel.bind('DeliveryLocationUpdated', (data) => {
                    console.log('Location updated:', data);
                    this.handleLocationUpdate(data);
                });

                this.channel.bind('DeliveryStatusUpdated', (data) => {
                    console.log('Status updated:', data);
                    this.handleStatusUpdate(data);
                });
            }

            updateDeliveryInfo() {
                const delivery = this.currentOrder;

                // Statut
                document.getElementById('deliveryStatus').textContent = 
                    this.statusTranslations[delivery.status] || delivery.status;
                
                const statusIndicator = document.getElementById('deliveryStatusIndicator');
                statusIndicator.className = `status-indicator status-${delivery.status}`;

                // Barre de progression
                const progressBar = document.getElementById('progressBar');
                const progress = this.statusProgress[delivery.status] || 0;
                progressBar.style.width = progress + '%';
                progressBar.setAttribute('aria-valuenow', progress);

                // Informations du livreur
                if (delivery.driver_name) {
                    document.getElementById('driverInfo').style.display = 'block';
                    document.getElementById('driverName').textContent = delivery.driver_name;
                    document.getElementById('driverPhone').textContent = delivery.driver_phone || 'Non renseigné';
                } else {
                    document.getElementById('driverInfo').style.display = 'none';
                }
            }

            updateMapView() {
                const delivery = this.currentOrder;

                // Destination (client)
                if (delivery.destination_lat && delivery.destination_lng) {
                    if (this.destinationMarker) {
                        this.destinationMarker.remove();
                    }
                    
                    this.destinationMarker = new mapboxgl.Marker({ color: 'green' })
                        .setLngLat([delivery.destination_lng, delivery.destination_lat])
                        .setPopup(new mapboxgl.Popup().setHTML(`
                            <strong>Destination</strong><br>
                            ${delivery.customer_name}<br>
                            ${delivery.destination_address}
                        `))
                        .addTo(this.map);
                }

                // Position du livreur
                if (delivery.driver_lat && delivery.driver_lng) {
                    this.updateDriverPosition(delivery.driver_lat, delivery.driver_lng);
                }

                // Centrer la carte
                if (delivery.destination_lat && delivery.destination_lng) {
                    this.map.flyTo({
                        center: [delivery.destination_lng, delivery.destination_lat],
                        zoom: 14
                    });
                }
            }

            updateDriverPosition(lat, lng) {
                if (this.driverMarker) {
                    this.driverMarker.remove();
                }
                
                this.driverMarker = new mapboxgl.Marker({ color: 'blue' })
                    .setLngLat([lng, lat])
                    .setPopup(new mapboxgl.Popup().setHTML(`
                        <strong>Livreur</strong><br>
                        ${this.currentOrder.driver_name || 'En cours...'}<br>
                        Position actuelle
                    `))
                    .addTo(this.map);

                // Calculer et afficher la route
                if (this.currentOrder.destination_lat && this.currentOrder.destination_lng) {
                    this.getRoute([lng, lat], [this.currentOrder.destination_lng, this.currentOrder.destination_lat]);
                }
            }

            async getRoute(start, end) {
                try {
                    const query = await fetch(
                        `https://api.mapbox.com/directions/v5/mapbox/driving/${start[0]},${start[1]};${end[0]},${end[1]}?steps=true&geometries=geojson&access_token=${this.mapboxToken}`
                    );
                    const json = await query.json();
                    
                    if (json.routes && json.routes.length > 0) {
                        const data = json.routes[0];
                        const route = data.geometry.coordinates;
                        
                        // Mettre à jour la route sur la carte
                        this.map.getSource('route').setData({
                            'type': 'Feature',
                            'properties': {},
                            'geometry': {
                                'type': 'LineString',
                                'coordinates': route
                            }
                        });

                        // Mettre à jour ETA et distance
                        const duration = Math.round(data.duration / 60); // en minutes
                        const distance = (data.distance / 1000).toFixed(1); // en km

                        document.getElementById('etaDisplay').textContent = duration + ' min';
                        document.getElementById('distanceDisplay').textContent = distance + ' km';
                    }
                } catch (error) {
                    console.error('Error getting route:', error);
                }
            }

            handleLocationUpdate(data) {
                if (data.delivery_id === this.currentOrder.id) {
                    this.updateDriverPosition(data.latitude, data.longitude);
                    this.addToHistory(`Livreur déplacé - ${new Date().toLocaleTimeString()}`);
                }
            }

            handleStatusUpdate(data) {
                if (data.delivery_id === this.currentOrder.id) {
                    this.currentOrder.status = data.status;
                    this.updateDeliveryInfo();
                    this.addToHistory(`Statut mis à jour: ${this.statusTranslations[data.status]} - ${new Date().toLocaleTimeString()}`);
                }
            }

            addToHistory(message) {
                const historyContainer = document.getElementById('deliveryHistory');
                const div = document.createElement('div');
                div.className = 'border-bottom pb-1 mb-1';
                div.innerHTML = `<small class="text-muted">${message}</small>`;
                historyContainer.insertBefore(div, historyContainer.firstChild);
            }

            callDriver() {
                if (this.currentOrder && this.currentOrder.driver_phone) {
                    alert(`Appel simulé vers: ${this.currentOrder.driver_phone}`);
                } else {
                    alert('Numéro de téléphone non disponible');
                }
            }

            resetTracking() {
                // Nettoyer les marqueurs
                if (this.driverMarker) {
                    this.driverMarker.remove();
                    this.driverMarker = null;
                }
                if (this.destinationMarker) {
                    this.destinationMarker.remove();
                    this.destinationMarker = null;
                }

                // Nettoyer la route
                if (this.map.getSource('route')) {
                    this.map.getSource('route').setData({
                        'type': 'Feature',
                        'properties': {},
                        'geometry': {
                            'type': 'LineString',
                            'coordinates': []
                        }
                    });
                }

                // Déconnecter les channels
                if (this.channel) {
                    this.pusher.unsubscribe(this.channel.name);
                    this.channel = null;
                }
                
                // Réinitialiser l'interface
                document.getElementById('setupPanel').style.display = 'block';
                document.getElementById('trackingPanel').style.display = 'none';
                document.getElementById('orderNumber').value = '';
                document.getElementById('deliveryHistory').innerHTML = '';
                this.currentOrder = null;
                
                this.loadAvailableOrders();
            }
        }

        // Initialiser le simulateur client
        let clientSimulator;
        document.addEventListener('DOMContentLoaded', function() {
            clientSimulator = new DeliveryClientSimulator();
        });
    </script>
</body>
</html>
