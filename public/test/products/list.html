<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes - Test API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/test/products/assets/css/style.css" rel="stylesheet">
    <style>
        .order-card {
            transition: transform 0.2s;
        }
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .order-status {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85em;
        }
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-paid { background-color: #d4edda; color: #155724; }
        .status-processing { background-color: #cce5ff; color: #004085; }
        .status-delivered { background-color: #d1ecf1; color: #0c5460; }
        .status-cancelled { background-color: #f8d7da; color: #721c24; }
        .json-response {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .navbar-custom {
            background-color: #007bff;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-shopping-cart"></i> Test API Customer</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" id="user-info">Connecté en tant que: <span id="user-name"></span></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-md-8">
                <h2><i class="fas fa-list"></i> Mes Commandes</h2>
                <p class="text-muted">Consultez toutes vos commandes et leurs statuts</p>
            </div>
            <div class="col-md-4 text-end">
                <a href="/test/products/create.html" class="btn btn-success">
                    <i class="fas fa-plus"></i> Nouvelle Commande
                </a>
                <button class="btn btn-primary" onclick="loadOrders()">
                    <i class="fas fa-refresh"></i> Actualiser
                </button>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-filter"></i> Filtres
                    <button class="btn btn-sm btn-outline-secondary float-end" type="button" onclick="toggleFilters()">
                        <i class="fas fa-chevron-down" id="filter-toggle-icon"></i>
                    </button>
                </h5>
            </div>
            <div class="card-body" id="filters-body" style="display: none;">
                <form id="filters-form">
                    <div class="row">
                        <!-- Order Number Filter -->
                        <div class="col-md-3 mb-3">
                            <label for="filter-order-number" class="form-label">Numéro de commande</label>
                            <input type="text" class="form-control" id="filter-order-number" placeholder="Rechercher...">
                        </div>
                        
                        <!-- Status Filter -->
                        <div class="col-md-3 mb-3">
                            <label for="filter-status" class="form-label">Statut</label>
                            <select class="form-select" id="filter-status">
                                <option value="">Tous les statuts</option>
                                <option value="pending">En attente</option>
                                <option value="paid">Payée</option>
                                <option value="processing">En traitement</option>
                                <option value="delivered">Livrée</option>
                                <option value="cancelled">Annulée</option>
                                <option value="failed">Échouée</option>
                            </select>
                        </div>
                        
                        <!-- Delivery Type Filter -->
                        <div class="col-md-3 mb-3">
                            <label for="filter-delivery-type" class="form-label">Type de livraison</label>
                            <select class="form-select" id="filter-delivery-type">
                                <option value="">Tous les types</option>
                                <option value="normal">Normal</option>
                                <option value="fast">Rapide</option>
                            </select>
                        </div>
                        
                        <!-- Payment Method Filter -->
                        <div class="col-md-3 mb-3">
                            <label for="filter-payment-method" class="form-label">Méthode de paiement</label>
                            <select class="form-select" id="filter-payment-method">
                                <option value="">Toutes les méthodes</option>
                                <option value="orange_money">Orange Money</option>
                                <option value="mtn_money">MTN Money</option>
                                <option value="credit_card">Carte de crédit</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <!-- Per Page Filter -->
                        <div class="col-md-3 mb-3">
                            <label for="filter-per-page" class="form-label">Éléments par page</label>
                            <select class="form-select" id="filter-per-page">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        
                        <div class="col-md-9 mb-3 d-flex align-items-end">
                            <button type="button" class="btn btn-primary me-2" onclick="applyFilters()">
                                <i class="fas fa-search"></i> Appliquer les filtres
                            </button>
                            <button type="button" class="btn btn-outline-secondary" onclick="clearFilters()">
                                <i class="fas fa-times"></i> Effacer
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Chargement...</span>
            </div>
            <p>Chargement des commandes...</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="alert alert-danger d-none" role="alert">
            <i class="fas fa-exclamation-triangle"></i> <span id="error-text"></span>
        </div>

        <!-- Orders List -->
        <div id="orders-container">
            <!-- Orders will be loaded here -->
        </div>

        <!-- Pagination -->
        <nav id="pagination-container" class="d-none">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination will be loaded here -->
            </ul>
        </nav>

        <!-- API Response Modal -->
        <div class="modal fade" id="apiResponseModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Réponse API</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <pre id="api-response-content" class="json-response"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentFilters = {};

        $(document).ready(function() {
            // Check if user is logged in
            const token = localStorage.getItem('api_token');
            const userFullName = localStorage.getItem('user_full_name');
            
            if (!token) {
                window.location.href = '/test/products/index.html';
                return;
            }

            // Display user info
            $('#user-name').text(userFullName || 'Utilisateur');

            // Load orders on page load
            loadOrders();
        });

        function toggleFilters() {
            const filtersBody = $('#filters-body');
            const icon = $('#filter-toggle-icon');
            
            if (filtersBody.is(':visible')) {
                filtersBody.slideUp();
                icon.removeClass('fa-chevron-up').addClass('fa-chevron-down');
            } else {
                filtersBody.slideDown();
                icon.removeClass('fa-chevron-down').addClass('fa-chevron-up');
            }
        }

        function buildQueryParams(page = 1) {
            const params = new URLSearchParams();
            params.append('page', page);
            
            // Add filters to params
            Object.keys(currentFilters).forEach(key => {
                if (currentFilters[key] && currentFilters[key] !== '') {
                    params.append(key, currentFilters[key]);
                }
            });
            
            return params.toString();
        }

        function applyFilters() {
            // Collect all filter values
            currentFilters = {
                order_number: $('#filter-order-number').val(),
                status: $('#filter-status').val(),
                delivery_type: $('#filter-delivery-type').val(),
                payment_method: $('#filter-payment-method').val(),
                per_page: $('#filter-per-page').val()
            };
            
            // Reset to page 1 when applying filters
            currentPage = 1;
            loadOrders(1);
        }

        function clearFilters() {
            // Clear all filter inputs
            $('#filter-order-number').val('');
            $('#filter-status').val('');
            $('#filter-delivery-type').val('');
            $('#filter-payment-method').val('');
            $('#filter-per-page').val('10');
            
            // Clear current filters
            currentFilters = {};
            
            // Reload orders without filters
            currentPage = 1;
            loadOrders(1);
        }

        function loadOrders(page = 1) {
            const token = localStorage.getItem('api_token');
            
            $('#loading').removeClass('d-none');
            $('#error-message').addClass('d-none');
            $('#orders-container').empty();

            const queryParams = buildQueryParams(page);

            $.ajax({
                url: `/api/my/orders?${queryParams}`,
                type: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/json'
                },
                success: function(response) {
                    $('#loading').addClass('d-none');
                    console.log('Orders API Response:', response);
                    
                    if (response.data && response.data.length > 0) {
                        displayOrders(response.data);
                        
                        // Handle pagination
                        if (response._metadata && response._metadata.pagination) {
                            currentPage = response._metadata.pagination.current_page;
                            totalPages = response._metadata.pagination.total_pages;
                            setupPagination(response._metadata.pagination);
                        }
                    } else {
                        $('#orders-container').html(`
                            <div class="text-center py-5">
                                <i class="fas fa-shopping-cart fa-3x text-muted mb-3"></i>
                                <h4>Aucune commande trouvée</h4>
                                <p class="text-muted">Vous n'avez pas encore passé de commandes.</p>
                                <a href="/test/products/create.html" class="btn btn-success">
                                    <i class="fas fa-plus"></i> Créer ma première commande
                                </a>
                            </div>
                        `);
                    }
                },
                error: function(jqXHR) {
                    $('#loading').addClass('d-none');
                    let errorMsg = 'Erreur lors du chargement des commandes';
                    
                    if (jqXHR.responseJSON && jqXHR.responseJSON.message) {
                        errorMsg += ': ' + jqXHR.responseJSON.message;
                    }
                    
                    $('#error-text').text(errorMsg);
                    $('#error-message').removeClass('d-none');
                    console.error('Orders API Error:', jqXHR.responseText);
                }
            });
        }

        function displayOrders(orders) {
            let html = '';
            
            orders.forEach(order => {
                const statusClass = `status-${order.status.replace('_', '')}`;
                const orderDate = new Date(order.order_date || order.created_at).toLocaleDateString('fr-FR');
                
                html += `
                    <div class="card order-card mb-3">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-md-3">
                                    <h6 class="mb-1">Commande #${order.order_number || order.id}</h6>
                                    <small class="text-muted">${orderDate}</small>
                                </div>
                                <div class="col-md-2">
                                    <span class="order-status ${statusClass}">
                                        ${order.status_label || order.status}
                                    </span>
                                </div>
                                <div class="col-md-2">
                                    <strong>${order.total_amount || order.total_price || 'N/A'} FCFA</strong>
                                </div>
                                <div class="col-md-2">
                                    <small class="text-muted">${order.items ? order.items.length : 'N/A'} articles</small>
                                </div>
                                <div class="col-md-3 text-end">
                                    <div class="btn-group btn-group-sm">
                                        <a href="/test/products/detail.html?id=${order.id}" class="btn btn-outline-primary">
                                            <i class="fas fa-eye"></i> Détail
                                        </a>
                                        <button class="btn btn-outline-info" onclick="showApiResponse(${JSON.stringify(order).replace(/"/g, '&quot;')})">
                                            <i class="fas fa-code"></i> JSON
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            $('#orders-container').html(html);
        }

        function setupPagination(pagination) {
            if (pagination.total_pages <= 1) {
                $('#pagination-container').addClass('d-none');
                return;
            }

            $('#pagination-container').removeClass('d-none');
            let paginationHtml = '';

            // Previous button
            if (pagination.current_page > 1) {
                paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="loadOrders(${pagination.current_page - 1})">Précédent</a></li>`;
            }

            // Page numbers
            for (let i = 1; i <= pagination.total_pages; i++) {
                const activeClass = i === pagination.current_page ? 'active' : '';
                paginationHtml += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="loadOrders(${i})">${i}</a></li>`;
            }

            // Next button
            if (pagination.current_page < pagination.total_pages) {
                paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="loadOrders(${pagination.current_page + 1})">Suivant</a></li>`;
            }

            $('#pagination').html(paginationHtml);
        }

        function showApiResponse(orderData) {
            $('#api-response-content').text(JSON.stringify(orderData, null, 2));
            new bootstrap.Modal(document.getElementById('apiResponseModal')).show();
        }

        function logout() {
            if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
                localStorage.clear();
                window.location.href = '/test/products/index.html';
            }
        }
    </script>
</body>
</html>
